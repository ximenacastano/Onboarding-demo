<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>De cero a primer cierre · Onboarding para vendedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FBF8F4;--bg-dk:#EDE0D0;--bg-md:#E6D5C0;
  --sb-bg:#ffffff;
  --txt:#2B2723;--txt-md:#5A4A3A;--txt-lt:#8A7A68;--txt-xlt:#B0A090;
  --terra:#b1775a;--terra-lt:#C8977A;--terra-pl:#F7E6D8;--terra-dk:#8A5540;
  --olive:#6b7152;--olive-lt:#8A9070;--olive-pl:#E2E4D8;
  --sand:#C4B090;--sand-lt:#E8DCCC;
  --pct-hl:#F7E6D8;
  --ff-head:'Playfair Display',Georgia,serif;
  --ff-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --sidebar:260px;
  --transition-dur:0.22s;
  --fs-add:0px
}
body[data-fz="1"]{--fs-add:2px}
body[data-fz="2"]{--fs-add:4px}
body[data-fz="3"]{--fs-add:6px}
body.dark{
  --bg:#1C1917;--bg-dk:#28231E;--bg-md:#322B25;
  --sb-bg:#221E1A;
  --txt:#F0E8DF;--txt-md:#C0B0A0;--txt-lt:#7A6A5A;--txt-xlt:#4A3A2A;
  --terra:#C8876A;--terra-lt:#D8A088;--terra-pl:#3A2418;--terra-dk:#E8B8A0;
  --olive:#8A9068;--olive-lt:#A8AE88;--olive-pl:#282C18;
  --sand:#8A7860;--sand-lt:#3A3020;
  --pct-hl:#282C18
}
body{background:var(--bg);font-family:var(--ff-body);color:var(--txt);font-size:16px;line-height:1.6;transition:background var(--transition-dur),color var(--transition-dur)}
#app{display:flex;height:100vh;min-height:600px;overflow:hidden}

/* ── OVERLAY (mobile) ───── */
#sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;backdrop-filter:blur(2px)}
#sb-overlay.on{display:block}

/* ── SIDEBAR ─────────────────────────────── */
#sb{width:var(--sidebar);background:var(--sb-bg);border-right:1px solid var(--bg-dk);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;font-size:13px;transition:background var(--transition-dur),border-color var(--transition-dur),left .25s}
#sb-top{padding:20px 16px 16px;border-bottom:1px solid var(--bg-dk)}
.sb-logo{display:flex;align-items:center;justify-content:center;padding:14px 16px 10px}
.sb-logo img{width:110px;height:110px;border-radius:12px;display:block}
.sb-ver{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-xlt);margin-bottom:5px;font-weight:600}
.sb-ttl{font-family:var(--ff-head);font-size:15px;font-weight:500;color:var(--txt);margin-bottom:2px;line-height:1.3}
.sb-sub{font-size:11px;color:var(--txt-lt);margin-bottom:10px}
.sb-prog{height:3px;background:var(--bg-dk);border-radius:2px}
.sb-pfill{height:100%;background:var(--terra);border-radius:2px;transition:width .5s}
.sb-pct{font-size:10px;color:var(--txt-lt);margin-top:4px}
.sb-map-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-xlt);padding:14px 16px 5px;font-weight:600}
.sb-mod{border-bottom:1px solid var(--bg-dk)}
.sb-mod-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background .15s;user-select:none}
.sb-mod-hdr:hover{background:var(--bg)}
.sb-mod-num{width:22px;height:22px;border-radius:50%;background:var(--bg-dk);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--txt-lt);flex-shrink:0;transition:all .2s}
.sb-mod-num.act{background:var(--terra);color:white}
.sb-mod-num.done{background:var(--olive);color:white}
.sb-mod-info{flex:1;min-width:0}
.sb-mod-name{font-size:13px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-mod-meta{font-size:10px;color:var(--txt-lt);margin-top:1px}
.sb-chev{font-size:13px;color:var(--txt-xlt);transition:transform .22s;flex-shrink:0}
.sb-mod.open .sb-chev{transform:rotate(180deg)}
.sb-slides{display:none;padding:3px 0 8px}
.sb-mod.open .sb-slides{display:block}
.sb-slide{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 22px;cursor:pointer;font-size:12px;color:var(--txt-lt);transition:background .12s;line-height:1.4}
.sb-slide:hover{background:var(--bg)}
.sb-slide.act{color:var(--terra);font-weight:600;background:var(--terra-pl)}
.sb-slide.done{color:var(--olive-lt)}
.sb-dot{width:6px;height:6px;border-radius:50%;background:var(--bg-dk);flex-shrink:0;transition:background .2s}
.sb-slide.act .sb-dot{background:var(--terra)}
.sb-slide.done .sb-dot{background:var(--olive)}
.sb-bottom{margin-top:auto;border-top:1px solid var(--bg-dk);padding:10px 14px}
.sb-bot-btn{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt-lt);padding:6px 2px;cursor:pointer;transition:color .15s}
.sb-bot-btn:hover{color:var(--txt-md)}

/* ── TOPBAR ──────────────────────────────── */
#tb{height:48px;background:var(--sb-bg);border-bottom:1px solid var(--bg-dk);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0;transition:background var(--transition-dur),border-color var(--transition-dur)}
#hamburger{display:none;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;cursor:pointer;color:var(--txt-lt);flex-shrink:0}
#hamburger:hover{background:var(--bg)}
.tb-lbl{font-size:12px;color:var(--txt-md);font-weight:600;white-space:nowrap;background:var(--pct-hl);border-radius:20px;padding:3px 10px;color:var(--olive)}
.tb-sect{font-size:12px;color:var(--txt-lt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
#tb-bw{flex:1;height:4px;background:var(--bg-dk);border-radius:2px}
#tb-bf{height:100%;background:var(--olive);border-radius:2px;transition:width .5s}
.tb-pct{font-size:12px;font-weight:600;min-width:42px;text-align:right;background:var(--pct-hl);border-radius:20px;padding:2px 8px;color:var(--olive)}
.tb-ic{font-size:16px;color:var(--txt-lt);cursor:pointer;padding:4px;opacity:.7;transition:opacity .15s,color .2s;flex-shrink:0}
.tb-ic:hover{opacity:1}
#tb-user{display:flex;align-items:center;gap:8px;margin-left:4px}
#tb-avatar{width:30px;height:30px;border-radius:50%;background:var(--olive);color:white;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background var(--transition-dur)}
#tb-greeting{font-size:12px;color:var(--txt-md);white-space:nowrap;font-weight:500}

/* ── MAIN ────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#content{flex:1;overflow-y:auto;padding:44px 60px 36px;transition:opacity .18s ease}
#content.fading{opacity:0}

/* ── SHARED TYPOGRAPHY ───────────────────── */
.mod-tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
h1.st{font-family:var(--ff-head);font-size:42px;font-weight:500;color:var(--txt);margin-bottom:12px;line-height:1.15}
.ss{font-size:calc(17px + var(--fs-add));color:var(--txt-md);line-height:1.65;margin-bottom:32px;max-width:680px}

/* ── WELCOME HERO ───────── */
.hero{display:grid;grid-template-columns:1fr 1fr;border-radius:14px;overflow:hidden;margin-bottom:28px;min-height:280px;border:1px solid var(--olive);border-radius:12px}
.hero-l{background:var(--terra-pl);padding:36px 32px}
.hero-badge{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hero-badge i{font-size:10px;color:var(--terra)}
.hero-ttl{font-family:var(--ff-head);font-size:26px;font-weight:600;color:var(--txt);margin-bottom:6px;line-height:1.2}
.hero-sub{font-family:var(--ff-head);font-size:18px;color:var(--terra);margin-bottom:16px;line-height:1.4;font-style:italic}
.hero-intro{font-size:calc(13px + var(--fs-add));color:var(--txt-md);margin-bottom:14px}
.hero-obj-lbl{font-size:11px;font-weight:600;color:var(--txt-md);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.hero-obj{list-style:none;font-size:calc(13px + var(--fs-add));color:var(--txt-md)}
.hero-obj li{display:flex;gap:10px;margin-bottom:8px;line-height:1.5;align-items:flex-start}
.hero-obj li .obj-bullet{width:18px;height:18px;border-radius:50%;background:var(--terra);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.hero-obj li .obj-bullet i{font-size:9px;color:white}
.hero-r{background:#e8e0d4;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:280px}
.hero-img-placeholder{width:100%;height:100%;object-fit:cover;display:block}
.hero-r-overlay{position:absolute;bottom:0;left:0;right:0;padding:18px 20px;background:linear-gradient(to top,rgba(43,39,35,.7) 0%,transparent 100%)}
.hero-r-caption{color:rgba(255,255,255,.9);font-size:12px;font-weight:500}
.hero-r-sub{color:rgba(255,255,255,.6);font-size:11px;margin-top:2px}

/* Before begin */
.bb{background:var(--sb-bg);border:1px solid var(--olive);border-radius:12px;padding:24px 28px;transition:background var(--transition-dur)}
.bb-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:10px}
.bb h3{font-family:var(--ff-head);font-size:20px;font-weight:500;margin-bottom:4px}
.bb p{font-size:calc(14px + var(--fs-add));color:var(--txt-md);margin-bottom:14px}
.bb-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bb-row input{flex:1;min-width:160px;padding:10px 16px;border:1px solid var(--olive);border-radius:8px;font-size:15px;background:var(--bg);font-family:var(--ff-body);color:var(--txt);outline:none;transition:border-color .2s,background var(--transition-dur),color var(--transition-dur)}
.bb-row input:focus{border-color:var(--terra)}
.bb-meta{font-size:11px;color:var(--txt-xlt);margin-top:10px}

/* ── CARDS ───────────────────────────────── */
.cards-g{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.card{background:var(--sb-bg);border:1px solid var(--olive);border-top:3px solid var(--olive);border-radius:10px;padding:22px;transition:background var(--transition-dur),transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.07)}
.card .ctag{font-size:10px;color:var(--txt-xlt);margin-bottom:12px;font-weight:600;letter-spacing:.08em}
.card i.ci{font-size:28px;color:var(--olive-pl);margin-bottom:14px;display:block;color:var(--olive)}
.card h4{font-family:var(--ff-head);font-size:16px;font-weight:500;margin-bottom:10px;color:var(--txt)}
.card p{font-size:calc(14px + var(--fs-add));color:var(--txt-md);line-height:1.65}

/* ── ACCORDION ───────────────────────────── */
.acc{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.ai{background:var(--sb-bg);border:1px solid var(--olive);border-radius:10px;overflow:hidden;transition:background var(--transition-dur)}
.ah{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;transition:background .15s}
.ah:hover{background:var(--bg)}
.aic{width:36px;height:36px;border-radius:50%;background:var(--olive-pl);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--olive);flex-shrink:0}
.ah h4{font-family:var(--ff-head);font-size:17px;font-weight:500;color:var(--txt);flex:1}
.ach{font-size:16px;color:var(--txt-xlt);transition:transform .22s}
.ai.open .ach{transform:rotate(180deg)}
.ab{display:none;padding:0 20px 20px 70px}
.ai.open .ab{display:block}
.ab p{font-size:calc(15px + var(--fs-add));color:var(--txt-md);line-height:1.7;margin-bottom:12px}
.ab-ex{background:var(--terra-pl);border-radius:8px;padding:12px 16px;border-left:3px solid var(--terra)}
.ab-ex .exl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:5px}
.ab-ex p{font-size:calc(13px + var(--fs-add));color:var(--txt-md);margin:0;line-height:1.55}

/* ── DRAG DROP ───────────────────────────── */
.dd-g{display:grid;grid-template-columns:1fr 1.7fr;gap:28px;margin-bottom:24px}
.dd-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-xlt);font-weight:600;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--olive);color:white;border-radius:20px;padding:9px 18px;font-size:calc(13px + var(--fs-add));cursor:grab;user-select:none;transition:opacity .2s,transform .15s;font-family:var(--ff-body)}
.chip:hover{transform:translateY(-2px);opacity:.88}
.dzones{display:flex;flex-direction:column;gap:10px}
.dz{background:var(--bg);border:2px dashed var(--olive);border-radius:10px;padding:14px 18px;min-height:56px;display:flex;align-items:center;justify-content:space-between;transition:border-color .2s,background .2s;font-size:calc(14px + var(--fs-add))}
.dz.over{border-color:var(--olive);background:var(--olive-pl)}
.dz.ok{border-color:var(--olive);background:#EAEDDF;border-style:solid}
.dz.no{border-color:var(--terra);background:var(--terra-pl);border-style:solid}
.dz .dzl{font-style:italic;color:var(--txt-lt)}
.dz .dzch{background:var(--olive);color:white;border-radius:12px;padding:4px 12px;font-size:12px}
.dz.no .dzch{background:var(--terra)}

/* ── PROFILE TABS ────────────────────────── */
.ptabs{display:flex;gap:10px;margin-bottom:24px}
.ptab{flex:1;border:1px solid var(--olive);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .18s;background:var(--sb-bg)}
.ptab:hover{background:var(--bg)}
.ptab.sel{background:var(--txt);border-color:var(--txt)}
.ptab .ptn{font-family:var(--ff-head);font-size:15px;font-weight:500;color:var(--txt);transition:color .18s}
.ptab.sel .ptn{color:white}
.ptab .ptr{font-size:12px;color:var(--txt-lt);margin-top:2px;transition:color .18s}
.ptab.sel .ptr{color:rgba(255,255,255,.55)}

/* ── PITCH BUILDER ───────────────────────── */
.pitch-g{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pitch-fields{display:flex;flex-direction:column;gap:12px}
.pf{background:var(--sb-bg);border:1px solid var(--olive);border-radius:10px;padding:16px 18px;transition:background var(--transition-dur)}
.pf-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pf-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);font-weight:600}
.pf-cnt{font-size:11px;color:var(--txt-xlt)}
.pf textarea{width:100%;border:none;background:transparent;font-family:var(--ff-body);font-size:calc(14px + var(--fs-add));color:var(--txt);resize:none;outline:none;min-height:68px;line-height:1.6}
.pf-hint{font-size:12px;color:var(--txt-xlt);font-style:italic;margin-top:6px;line-height:1.5;border-top:1px solid var(--bg-dk);padding-top:6px}
.pp{background:var(--sb-bg);border:1px solid var(--olive);border-radius:10px;padding:22px;display:flex;flex-direction:column;transition:background var(--transition-dur)}
.pp-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-xlt);font-weight:600;margin-bottom:3px}
.pp-pname{font-size:11px;color:var(--terra);margin-bottom:14px;font-weight:600}
.pp-cnt{font-size:11px;color:var(--txt-xlt);margin-bottom:10px}
.pp-txt{font-family:var(--ff-head);font-size:calc(15px + var(--fs-add));color:var(--txt-md);line-height:1.85;flex:1;min-height:140px;font-style:italic}
.pp-ph{color:var(--sand);font-style:italic;font-family:var(--ff-head)}
.pp-toks{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--bg-dk)}
.pp-tok{background:var(--bg-dk);border-radius:4px;padding:3px 9px;font-size:10px;color:var(--txt-lt);font-weight:600;letter-spacing:.05em}
.pp-tok.on{background:var(--olive-pl);color:var(--olive)}

/* ── BRANCHING ───────────────────────────── */
.persona-row{display:flex;align-items:center;gap:14px;background:var(--sb-bg);border:1px solid var(--olive);border-radius:10px;padding:14px 18px;margin-bottom:20px;transition:background var(--transition-dur)}
.pav{width:46px;height:46px;border-radius:50%;background:var(--olive);display:flex;align-items:center;justify-content:center;color:white;font-family:var(--ff-head);font-size:16px;font-weight:500;flex-shrink:0}
.pnm{font-size:15px;font-weight:600;color:var(--txt)}
.prl{font-size:12px;color:var(--txt-lt)}
.mbadge{margin-left:auto;background:var(--pct-hl);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--olive);font-weight:600;white-space:nowrap}
.bubble{background:var(--bg-dk);border-radius:14px 14px 14px 4px;padding:16px 20px;margin-bottom:20px;font-size:calc(15px + var(--fs-add));color:var(--txt);line-height:1.65}
.br-prompt{font-size:calc(14px + var(--fs-add));color:var(--txt-md);margin-bottom:14px;font-weight:600}
.bropts{display:flex;flex-direction:column;gap:10px}
.brbtn{background:var(--sb-bg);border:1px solid var(--olive);border-radius:10px;padding:13px 18px;text-align:left;font-size:calc(14px + var(--fs-add));cursor:pointer;font-family:var(--ff-body);color:var(--txt);display:flex;gap:12px;align-items:flex-start;transition:all .15s}
.brbtn:hover{background:var(--bg);border-color:var(--terra)}
.brltr{width:26px;height:26px;border-radius:6px;background:var(--olive-pl);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--olive);flex-shrink:0;margin-top:1px}
.brbtn.best{border-color:var(--olive);background:#EAEDDF}
.brbtn.bad{border-color:var(--terra-lt);background:var(--terra-pl)}
.brbtn.best .brltr{background:var(--olive);color:white}
.brbtn.bad .brltr{background:var(--terra);color:white}
.brfb{border-radius:8px;padding:12px 16px;margin-top:10px;font-size:calc(13px + var(--fs-add));line-height:1.55}
.brfb.g{background:#EAEDDF;color:var(--olive);border:1px solid var(--olive-pl)}
.brfb.b{background:var(--terra-pl);color:var(--terra-dk);border:1px solid #D4A89A}

/* ── QUIZ ────────────────────────────────── */
.qcard{background:var(--sb-bg);border:1px solid var(--olive);border-radius:12px;padding:28px;transition:background var(--transition-dur)}
.q-meta{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-lt);margin-bottom:14px;font-weight:600}
.q-txt{font-family:var(--ff-head);font-size:21px;color:var(--txt);margin-bottom:22px;line-height:1.5}
.qopts{display:flex;flex-direction:column;gap:10px}
.qo{background:var(--sb-bg);border:1px solid var(--olive);border-radius:8px;padding:13px 18px;cursor:pointer;font-size:calc(15px + var(--fs-add));font-family:var(--ff-body);color:var(--txt);text-align:left;display:flex;align-items:center;gap:12px;transition:all .15s}
.qo:hover{background:var(--bg);border-color:var(--terra)}
.ql{width:28px;height:28px;border-radius:6px;background:var(--olive-pl);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--olive);flex-shrink:0}
.qo.cor{border-color:var(--olive);background:#EAEDDF}
.qo.cor .ql{background:var(--olive);color:white}
.qo.wr{border-color:var(--terra);background:var(--terra-pl)}
.qo.wr .ql{background:var(--terra);color:white}
.qfb{border-radius:8px;padding:14px 16px;margin-top:14px;font-size:14px;line-height:1.6}
.qfb.ok{background:#EAEDDF;color:var(--olive);border:1px solid var(--olive-pl)}
.qfb.nok{background:var(--terra-pl);color:var(--terra-dk);border:1px solid #D4A89A}
.q-next{margin-top:16px;font-size:13px;color:var(--txt-lt);font-style:italic}


/* ── QUIZ: pending & confirm ── */
.qo.qo-sel{border-color:var(--terra);background:var(--terra-pl)}
.qo.qo-sel .ql{background:var(--terra);color:white}
.q-footer{display:flex;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--olive-pl)}
.q-confirm{background:#c9c5bc;color:white;border:none;border-radius:8px;padding:11px 22px;font-size:14px;font-weight:600;font-family:var(--ff-body);cursor:not-allowed;display:inline-flex;align-items:center;gap:6px;transition:background .2s,transform .15s}
.q-confirm.on{background:var(--terra);cursor:pointer}
.q-confirm.on:hover{opacity:.9;transform:translateY(-1px)}

/* ── BRANCH/SCENARIO: pending & confirm ── */
.brbtn.br-sel{border-color:var(--terra)!important;background:var(--terra-pl)!important}
.brbtn.br-sel .brltr{background:var(--terra)!important;color:white!important}
.br-footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--olive-pl)}
.br-confirm{background:#c9c5bc;color:white;border:none;border-radius:8px;padding:11px 22px;font-size:14px;font-weight:600;font-family:var(--ff-body);cursor:not-allowed;display:inline-flex;align-items:center;gap:6px;transition:background .2s,transform .15s}
.br-confirm.on{background:var(--terra);cursor:pointer}
.br-confirm.on:hover{opacity:.9;transform:translateY(-1px)}
.br-sig{background:var(--olive);color:white;border:none;border-radius:8px;padding:11px 22px;font-size:14px;font-weight:600;font-family:var(--ff-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:opacity .15s}
.br-sig:hover{opacity:.85}
.br-disabled-lbl{font-size:12px;color:var(--txt-xlt);font-style:italic}

/* ── REFLECT ─────────────────────────────── */
.rcard{background:var(--sb-bg);border:1px solid var(--olive);border-radius:12px;padding:26px;transition:background var(--transition-dur)}
.rcard p{font-size:15px;color:var(--txt-md);margin-bottom:18px;line-height:1.65}
.rcard textarea{width:100%;min-height:120px;border:1px solid var(--olive);border-radius:8px;padding:14px;font-size:15px;font-family:var(--ff-body);color:var(--txt);background:var(--bg);resize:vertical;outline:none;line-height:1.6;transition:border-color .2s,background var(--transition-dur),color var(--transition-dur)}
.rcard textarea:focus{border-color:var(--terra)}

/* ── STEPS ───────────────────────────────── */
.slist{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.sitem{display:flex;gap:16px;background:var(--olive);border-radius:12px;padding:18px 22px}
.snum{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:white;font-size:13px;font-weight:600;flex-shrink:0;margin-top:2px}
.sitem h5{font-family:var(--ff-head);font-size:15px;font-weight:500;color:white;margin-bottom:5px}
.sitem p{font-size:13px;color:rgba(255,255,255,.75);line-height:1.55}

/* ── PIPELINE ────────────────────────────── */
.pipe-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.pipe-card{background:var(--sb-bg);border:1px solid var(--olive);border-radius:10px;padding:18px;cursor:pointer;transition:all .18s}
.pipe-card:hover{background:var(--bg)}
.pipe-card.sel{border-color:var(--terra);background:var(--terra-pl)}
.pipe-num{width:28px;height:28px;border-radius:6px;background:var(--olive);color:white;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;margin-bottom:10px}
.pipe-card.sel .pipe-num{background:var(--terra)}
.pipe-card h5{font-family:var(--ff-head);font-size:14px;font-weight:500;color:var(--txt);margin-bottom:4px}
.pipe-card p{font-size:12px;color:var(--txt-lt);line-height:1.5}
.pipe-detail{background:var(--sb-bg);border:1px solid var(--olive);border-radius:10px;padding:22px;margin-bottom:20px;min-height:80px;transition:background var(--transition-dur)}
.pipe-detail-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:12px}
.pipe-detail h4{font-family:var(--ff-head);font-size:18px;font-weight:500;margin-bottom:10px}
.pipe-detail p{font-size:14px;color:var(--txt-md);line-height:1.65;margin-bottom:8px}
.pipe-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pipe-chip{background:var(--bg-dk);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--txt-md)}

/* ── SCENARIO ────────────────────────────── */
.sc-wrap{background:var(--sb-bg);border:1px solid var(--olive);border-radius:12px;overflow:hidden;margin-bottom:20px;transition:background var(--transition-dur)}
.sc-head{background:var(--olive);padding:20px 24px;display:flex;align-items:center;gap:14px}
.sc-av{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:white;font-family:var(--ff-head);font-size:16px;font-weight:500;flex-shrink:0}
.sc-nm{font-family:var(--ff-head);font-size:16px;color:white;font-weight:500}
.sc-rl{font-size:12px;color:rgba(255,255,255,.65)}
.sc-body{padding:22px 24px}
.sc-scene{font-size:15px;color:var(--txt-md);line-height:1.65;margin-bottom:18px;font-style:italic;border-left:3px solid var(--terra);padding-left:16px}
.sc-q{font-size:15px;font-weight:600;color:var(--txt);margin-bottom:16px}

/* ── COMPLETE / CERTIFICATE ─────────────── */
.done-wrap{text-align:center;padding:40px 32px}
.done-icon{font-size:64px;color:var(--terra);margin-bottom:24px}
.done-wrap h2{font-family:var(--ff-head);font-size:34px;font-weight:500;margin-bottom:14px;color:var(--txt)}
.done-wrap p{font-size:16px;color:var(--txt-md);margin-bottom:28px;line-height:1.65;max-width:520px;margin-left:auto;margin-right:auto}
.done-bgs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:32px}
.dbg{background:var(--olive-pl);color:var(--olive);border-radius:20px;padding:7px 18px;font-size:13px;font-weight:600}
.cert-locked{border:2px dashed var(--bg-md);border-radius:16px;padding:32px 40px;max-width:600px;margin:0 auto 28px;background:var(--sb-bg);text-align:center}
.cert-lock-ic{font-size:48px;color:var(--txt-xlt);margin-bottom:16px;display:block}
.cert-locked h3{font-family:var(--ff-head);font-size:22px;color:var(--txt-lt);margin-bottom:8px}
.cert-locked>p{font-size:14px;color:var(--txt-lt);margin-bottom:20px}
.cert-reqs{list-style:none;display:flex;flex-direction:column;gap:10px;text-align:left}
.cert-reqs li{display:flex;align-items:center;gap:10px;font-size:14px;padding:10px 14px;border-radius:8px}
.req-ok{background:var(--olive-pl);color:var(--olive)}
.req-ok i{color:var(--olive);font-size:16px}
.req-fail{background:var(--terra-pl);color:var(--terra-dk)}
.req-fail i{color:var(--terra);font-size:16px}
.cert{border:2px solid var(--olive);border-radius:16px;padding:36px 48px;max-width:600px;margin:0 auto 28px;background:var(--sb-bg);position:relative}
.cert::before{content:'';position:absolute;inset:6px;border:1px solid var(--olive-pl);border-radius:11px;pointer-events:none}
.cert-badge{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:10px}
.cert h3{font-family:var(--ff-head);font-size:28px;font-weight:600;color:var(--txt);margin-bottom:6px}
.cert-name{font-family:var(--ff-head);font-size:38px;font-weight:400;color:var(--terra);margin:10px 0;font-style:italic}
.cert-desc{font-size:14px;color:var(--txt-md);line-height:1.6;margin-top:12px;border-top:1px solid var(--bg-dk);padding-top:14px}
.cert-date{font-size:11px;color:var(--txt-xlt);margin-top:10px}

/* ── FOOTER NAV ──────────────────────────── */
#fn{background:var(--sb-bg);border-top:1px solid var(--bg-dk);padding:16px 60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;transition:background var(--transition-dur),border-color var(--transition-dur)}
.fn-meta{font-size:13px;color:var(--txt-lt);display:flex;align-items:center;gap:6px}
.btn{padding:11px 26px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:var(--ff-body);transition:all .15s}
.btn-p{background:var(--terra);color:white}
.btn-p:hover{background:var(--terra-dk)}
.btn-s{background:transparent;color:var(--txt-md);border:1px solid var(--olive)}
.btn-s:hover{background:var(--bg)}
.btn-sv{background:var(--olive);color:white}
.btn-sv:hover{background:#525840}

/* ── MODAL (reset confirm) ──────────────── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal-bg.on{display:flex}
.modal{background:var(--sb-bg);border:1px solid var(--olive);border-radius:14px;padding:32px;max-width:380px;width:90%;text-align:center}
.modal h3{font-family:var(--ff-head);font-size:22px;margin-bottom:12px;color:var(--txt)}
.modal p{font-size:14px;color:var(--txt-md);margin-bottom:24px;line-height:1.6}
.modal-btns{display:flex;gap:10px;justify-content:center}

/* ── KEYBOARD HINT ──────────────────────── */
.kb-hint{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt-xlt)}
.kb{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 5px;border:1px solid var(--bg-dk);border-radius:4px;font-size:10px;font-family:var(--ff-body);background:var(--bg);color:var(--txt-lt)}

/* ── MOBILE ─────────────────────────────── */
@media(max-width:768px){
  #hamburger{display:flex}
  #sb{position:fixed;left:-270px;top:0;bottom:0;z-index:100;width:270px}
  #sb.mob-open{left:0}
  #tb-sect{display:none}
  #content{padding:24px 20px 24px}
  #fn{padding:12px 20px}
  .hero{grid-template-columns:1fr}
  .hero-r{min-height:140px}
  .cards-g{grid-template-columns:1fr}
  .pipe-grid{grid-template-columns:repeat(2,1fr)}
  .pitch-g{grid-template-columns:1fr}
  .dd-g{grid-template-columns:1fr}
  h1.st{font-size:26px}
  .ss{font-size:15px}
  #tb-greeting{display:none}
  .kb-hint{display:none}
}
@media(max-width:480px){
  .pipe-grid{grid-template-columns:1fr}
  .ptabs{flex-direction:column}
  .cert{padding:24px 20px}
  .cert-name{font-size:28px}
}

/* ── CARD STAGGER ANIMATION ─────────────── */
@keyframes fadeInUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.card-anim{opacity:0;animation:fadeInUp .48s ease forwards}

/* ── CALCULATOR ─────────────────────────── */
.calc-wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:20px;align-items:start}
.calc-inputs{display:flex;flex-direction:column;gap:18px}
.calc-field label{display:block;font-size:14px;color:var(--txt-md);margin-bottom:8px;font-weight:500;line-height:1.5}
.calc-input-row{display:flex;align-items:center;gap:10px}
.calc-input-row input{width:100px;padding:10px 14px;border:1px solid var(--olive);border-radius:8px;font-size:22px;font-weight:600;font-family:var(--ff-head);color:var(--txt);background:var(--bg);outline:none;transition:border-color .2s,background var(--transition-dur),color var(--transition-dur)}
.calc-input-row input:focus{border-color:var(--terra)}
.calc-unit{font-size:13px;color:var(--txt-lt);white-space:nowrap}
.calc-result{background:var(--sb-bg);border:1px solid var(--olive);border-radius:12px;padding:28px;min-height:130px;display:flex;align-items:center;justify-content:center;transition:background var(--transition-dur)}
.calc-placeholder{font-size:14px;color:var(--txt-xlt);font-style:italic;text-align:center}
.calc-num-grid{display:flex;align-items:center;justify-content:space-around;gap:12px;width:100%}
.calc-stat{text-align:center}
.calc-num{font-family:var(--ff-head);font-size:34px;font-weight:500;color:var(--terra);line-height:1.1}
.calc-lbl{font-size:10px;color:var(--txt-lt);margin-top:4px;text-transform:uppercase;letter-spacing:.08em}
.calc-div{width:1px;height:56px;background:var(--bg-dk)}
.calc-insight{display:flex;align-items:flex-start;gap:14px;background:var(--terra-pl);border:1px solid var(--terra);border-radius:10px;padding:16px 20px;margin-top:10px}
.calc-insight i{font-size:20px;color:var(--terra);flex-shrink:0;margin-top:2px}
.calc-insight p{font-size:14px;color:var(--txt-md);line-height:1.6;margin:0}

/* ── SERVICES GRID (flip cards) ─────────── */
.srv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.srv-card{height:150px;cursor:pointer;perspective:900px}
.srv-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.srv-card.flipped .srv-inner{transform:rotateY(180deg)}
.srv-front,.srv-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.srv-front{background:var(--sb-bg);border:1px solid var(--olive);border-top:3px solid var(--olive);transition:background var(--transition-dur)}
.srv-back{background:var(--terra-pl);border:1px solid var(--terra);transform:rotateY(180deg)}
.srv-icon{font-size:26px;color:var(--olive);margin-bottom:8px;display:block}
.srv-name{font-family:var(--ff-head);font-size:13px;font-weight:500;color:var(--txt);line-height:1.3;margin-bottom:5px}
.srv-hint{font-size:10px;color:var(--txt-xlt);letter-spacing:.04em}
.srv-back-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:6px}
.srv-back-txt{font-size:12px;color:var(--txt-md);line-height:1.5}

/* ── VALUE PROP TABLE ───────────────────── */
.vp-table{border:1px solid var(--olive);border-radius:12px;overflow:hidden;margin-bottom:20px}
.vp-hdr{display:grid;grid-template-columns:150px 1fr 1fr;background:var(--olive);color:white}
.vp-hdr>div{padding:12px 16px;font-size:12px;font-weight:600}
.vp-hdr-us{background:rgba(255,255,255,.15)}
.vp-row{display:grid;grid-template-columns:150px 1fr 1fr;border-top:1px solid var(--bg-dk);cursor:pointer;transition:background .15s}
.vp-row:hover:not(.revealed){background:var(--bg)}
.vp-feat{padding:14px 16px;font-size:12px;font-weight:600;color:var(--txt-md);background:var(--bg);text-transform:uppercase;letter-spacing:.04em}
.vp-gen{padding:14px 16px;font-size:13px;color:var(--txt-lt)}
.vp-us{padding:14px 16px;font-size:13px;color:var(--olive);background:var(--olive-pl);font-weight:500}
.vp-ph{color:var(--txt-xlt);font-style:italic;font-size:12px}

/* ── PROFILE QUIZ ───────────────────────── */
.pq-case{background:var(--sb-bg);border:1px solid var(--olive);border-radius:10px;padding:20px;margin-bottom:14px;transition:background var(--transition-dur)}
.pq-num{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-xlt);font-weight:600;margin-bottom:10px}
.pq-txt{font-family:var(--ff-head);font-size:15px;color:var(--txt);line-height:1.6;margin-bottom:16px;font-style:italic;border-left:3px solid var(--terra);padding-left:14px}
.pq-opts{display:flex;gap:10px;flex-wrap:wrap}
.pq-btn{background:var(--bg);border:1px solid var(--olive);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:var(--ff-body);color:var(--txt);transition:all .15s}
.pq-btn:hover{background:var(--bg-dk);border-color:var(--terra)}
.pq-btn.pq-cor{background:#EAEDDF;border-color:var(--olive);color:var(--olive);font-weight:600}
.pq-btn.pq-wr{background:var(--terra-pl);border-color:var(--terra);color:var(--terra-dk)}
.pq-fb{margin-top:12px;border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.55}
.pq-fb-ok{background:#EAEDDF;color:var(--olive);border:1px solid var(--olive-pl)}
.pq-fb-nok{background:var(--terra-pl);color:var(--terra-dk);border:1px solid #D4A89A}

/* ── ICEBERG ────────────────────────────── */
.iceberg-top{background:var(--terra-pl);border:1px solid var(--terra);border-radius:12px 12px 0 0;padding:22px 28px}
.iceberg-top-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:10px}
.iceberg-water{height:10px;background:linear-gradient(to bottom,rgba(107,113,82,.25),rgba(107,113,82,.07));border-left:1px solid var(--olive);border-right:1px solid var(--olive)}
.iceberg-bot{background:var(--olive-pl);border:1px solid var(--olive);border-radius:0 0 12px 12px;padding:22px 28px;margin-bottom:20px}
.iceberg-bot-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--olive);font-weight:600;margin-bottom:10px}
.ice-item{background:var(--sb-bg);border-radius:8px;padding:9px 14px;margin-bottom:8px;font-size:14px;color:var(--txt-md);font-style:italic;border:1px solid var(--bg-dk)}
.ice-item-dark{background:rgba(107,113,82,.12);border-radius:8px;padding:9px 14px;margin-bottom:8px;font-size:14px;color:var(--txt);border:1px solid var(--olive-pl);opacity:0;transition:opacity .4s}
.ice-item-dark.vis{opacity:1}
.iceberg-insight{display:flex;align-items:flex-start;gap:14px;background:var(--olive-pl);border:1px solid var(--olive);border-radius:10px;padding:16px 20px;margin-top:14px;display:none}
.iceberg-insight.vis{display:flex}
.iceberg-insight i{font-size:20px;color:var(--olive);flex-shrink:0;margin-top:2px}
.iceberg-insight div{font-size:14px;color:var(--txt-md);line-height:1.6}

/* ── FFF MODEL ──────────────────────────── */
.fff-intro{display:flex;align-items:center;gap:8px;background:var(--sb-bg);border:1px solid var(--olive);border-radius:10px;padding:16px 20px;margin-bottom:20px;flex-wrap:wrap;transition:background var(--transition-dur)}
.fff-step{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;min-width:90px;text-align:center}
.fff-badge{border-radius:20px;padding:4px 14px;font-size:12px;font-weight:700;letter-spacing:.04em}
.fff-f1{background:var(--terra);color:white}
.fff-f2{background:var(--olive);color:white}
.fff-f3{background:var(--txt);color:white}
.fff-step-desc{font-size:11px;color:var(--txt-lt);line-height:1.4}
.fff-arrow{color:var(--txt-xlt);font-size:18px}
.fff-resp{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.fff-pill{border-radius:4px;padding:2px 9px;font-size:9px;font-weight:700;letter-spacing:.06em;flex-shrink:0;margin-top:4px}

/* ── OBJECTIONS PRACTICE ────────────────── */
.ob-practice{display:flex;flex-direction:column;gap:14px}
.ob-item{background:var(--sb-bg);border:1px solid var(--olive);border-radius:10px;padding:18px;display:flex;gap:14px;transition:background var(--transition-dur)}
.ob-num{width:26px;height:26px;border-radius:50%;background:var(--olive);color:white;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.ob-content{flex:1}
.ob-quote{font-family:var(--ff-head);font-size:14px;color:var(--txt);font-style:italic;margin-bottom:10px;line-height:1.5;border-left:3px solid var(--terra);padding-left:12px}
.ob-ta{width:100%;min-height:72px;border:1px solid var(--olive);border-radius:8px;padding:9px 12px;font-size:13px;font-family:var(--ff-body);color:var(--txt);background:var(--bg);resize:vertical;outline:none;line-height:1.5;margin-bottom:8px;transition:border-color .2s,background var(--transition-dur),color var(--transition-dur)}
.ob-ta:focus{border-color:var(--terra)}
.ob-checks{display:flex;gap:10px;flex-wrap:wrap}
.ob-ck{font-size:11px;color:var(--txt-lt);display:flex;align-items:center;gap:4px;transition:color .2s}

/* ── CLOSE COMPARE ──────────────────────── */
.cc-table{border:1px solid var(--olive);border-radius:12px;overflow:hidden;margin-bottom:18px}
.cc-hdr{display:grid;grid-template-columns:130px 1fr 1fr;background:var(--txt);color:white}
.cc-hdr>div{padding:11px 16px;font-size:12px;font-weight:600}
.cc-hdr-us{background:rgba(255,255,255,.12)}
.cc-row{display:grid;grid-template-columns:130px 1fr 1fr;border-top:1px solid var(--bg-dk)}
.cc-asp{padding:13px 16px;font-size:11px;font-weight:600;color:var(--txt-md);background:var(--bg);text-transform:uppercase;letter-spacing:.04em}
.cc-pres{padding:13px 16px;font-size:13px;color:var(--txt-lt)}
.cc-cons{padding:13px 16px;font-size:13px;color:var(--olive);background:var(--olive-pl);font-weight:500}
.cc-key{display:flex;align-items:flex-start;gap:14px;background:var(--olive-pl);border:1px solid var(--olive);border-radius:10px;padding:16px 20px}
.cc-key i{font-size:20px;color:var(--olive);flex-shrink:0;margin-top:2px}
.cc-key div{font-size:14px;color:var(--txt-md);line-height:1.6}

/* ── 90-DAY PLAN ────────────────────────── */
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:14px}
.plan-card{background:var(--sb-bg);border:1px solid var(--olive);border-top:3px solid var(--olive);border-radius:10px;padding:18px;transition:background var(--transition-dur)}
.plan-title{font-family:var(--ff-head);font-size:14px;font-weight:500;color:var(--txt);margin-bottom:4px}
.plan-desc{font-size:12px;color:var(--txt-lt);margin-bottom:14px;line-height:1.5}
.plan-fields{display:flex;flex-direction:column;gap:10px}
.plan-field label{display:block;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--terra);margin-bottom:3px}
.plan-field input,.plan-field select{width:100%;padding:7px 10px;border:1px solid var(--olive);border-radius:6px;font-size:13px;font-family:var(--ff-body);color:var(--txt);background:var(--bg);outline:none;transition:border-color .2s,background var(--transition-dur),color var(--transition-dur)}
.plan-field input:focus,.plan-field select:focus{border-color:var(--terra)}

/* ── MOBILE additions ───────────────────── */
@media(max-width:768px){
  .calc-wrap{grid-template-columns:1fr}
  .srv-grid{grid-template-columns:repeat(2,1fr)}
  .vp-table,.cc-table{overflow-x:auto}
  .plan-grid{grid-template-columns:1fr}
  .fff-intro{flex-direction:column;align-items:flex-start}
  .fff-arrow{display:none}
}
@media(max-width:480px){.srv-grid{grid-template-columns:1fr}}

/* ── PRINT (certificate) ────────────────── */
@media print{
  #sb,#tb,#fn,#sb-overlay,.modal-bg,.done-btns,.done-bgs{display:none!important}
  #main{overflow:visible}
  #content{overflow:visible;padding:0}
  .cert{border-color:#6b7152;page-break-inside:avoid}
}
</style>
</head>

      <button class="btn btn-p" onclick="confirmReset()">Sí, reiniciar</button>

  </div>
</div>

<script>
const MODS=[
  {num:'01',name:'¿Qué vendemos?',dur:'75 min',slides:[
    {id:'w',lbl:'Bienvenida',t:'welcome'},
    {id:'1.02',lbl:'¿Cuánto cuesta el tiempo?',t:'calc_time'},
    {id:'1.01',lbl:'El primer paso para vender',t:'cards'},
    {id:'1.05',lbl:'¿Qué no es automatización?',t:'acc_dif'},
    {id:'1.06',lbl:'El catálogo de servicios',t:'services_catalog'},
    {id:'1.07',lbl:'Servicio → Problema',t:'dragdrop'},
    {id:'1.08',lbl:'¿Por qué nosotros?',t:'value_prop'},
    {id:'1.11',lbl:'Verifica tu comprensión',t:'quiz1'},
    {id:'1.12',lbl:'Reto de cierre',t:'reflect_close1'}
  ]},
  {num:'02',name:'Conoce a tu cliente',dur:'90 min',slides:[
    {id:'2.02',lbl:'Tres personas, tres mundos',t:'cards_bp'},
    {id:'2.06',lbl:'¿A quién tienes adelante?',t:'profile_quiz'},
    {id:'2.07',lbl:'El iceberg del cliente',t:'iceberg_content'},
    {id:'2.08',lbl:'El modelo SPIN',t:'acc_spin'},
    {id:'2.10',lbl:'Simula la primera llamada',t:'branch'}
  ]},
  {num:'03',name:'El discurso de ventas',dur:'90 min',slides:[
    {id:'3.02',lbl:'¿Cómo suenan tus 60 segundos?',t:'reflect'},
    {id:'3.07',lbl:'Construye tu pitch',t:'pitch'},
    {id:'3.09',lbl:'Manejo de objeciones',t:'fff_model'},
    {id:'3.11',lbl:'Practica las respuestas',t:'objections_practice'}
  ]},
  {num:'04',name:'El proceso comercial',dur:'75 min',slides:[
    {id:'4.01',lbl:'El pipeline de la agencia',t:'pipeline'},
    {id:'4.08',lbl:'La propuesta: estructura y lógica',t:'acc_prop'},
    {id:'4.11',lbl:'Verifica tu comprensión',t:'quiz4'}
  ]},
  {num:'05',name:'Cierre, handoff y éxito del cliente',dur:'75 min',slides:[
    {id:'5.03',lbl:'Cierre consultivo vs. presión',t:'close_compare'},
    {id:'5.04',lbl:'Señales de compra',t:'acc_signals'},
    {id:'5.06',lbl:'El handoff: sin fricciones',t:'steps'},
    {id:'5.07',lbl:'Simula el cierre',t:'scenario_close'},
    {id:'5.09',lbl:'Los primeros 90 días',t:'plan_90'},
    {id:'5.11',lbl:'¡Completado!',t:'complete'}
  ]}
];
const flat=[];
MODS.forEach((m,mi)=>m.slides.forEach((s,si)=>flat.push({...s,mi,si})));
const TOT=flat.length;

// ── STATE ─────────────────────────────────
let cur=0,done=new Set(),uname='',qAns=false,qIdx=0,brStep=0,
    pData={L:{g:'',p:'',c:'',pr:''},D:{g:'',p:'',c:'',pr:''},Pa:{g:'',p:'',c:'',pr:''}},
    aprof='L',pipeSelIdx=null,scStep=0,isDark=false,pitchReflect='',reflectClose1='',
    plan90={m1:{obj:'',canal:'',msg:'',accion:''},m2:{obj:'',canal:'',msg:'',accion:''},m3:{obj:'',canal:'',msg:'',accion:''}},
    quizScores={};

// ── LOCALSTORAGE ──────────────────────────
function saveState(){
  try{
    localStorage.setItem('hf_ob_v2',JSON.stringify({
      cur,done:[...done],uname,pData,aprof,isDark,pitchReflect,reflectClose1,plan90,quizScores
    }));
  }catch(e){}
}
function loadState(){
  try{
    const raw=localStorage.getItem('hf_ob_v2');
    if(!raw)return;
    const d=JSON.parse(raw);
    cur=d.cur||0;
    done=new Set(d.done||[]);
    uname=d.uname||'';
    pData=d.pData||{L:{g:'',p:'',c:'',pr:''},D:{g:'',p:'',c:'',pr:''},Pa:{g:'',p:'',c:'',pr:''}};
    aprof=d.aprof||'L';
    isDark=!!d.isDark;
    pitchReflect=d.pitchReflect||'';
    reflectClose1=d.reflectClose1||'';
    plan90=d.plan90||{m1:{obj:'',canal:'',msg:'',accion:''},m2:{obj:'',canal:'',msg:'',accion:''},m3:{obj:'',canal:'',msg:'',accion:''}};
    quizScores=d.quizScores||{};
    if(isDark)document.body.classList.add('dark');
    document.getElementById('dark-lbl').textContent=isDark?'Modo claro':'Modo oscuro';
    fzLvl=parseInt(localStorage.getItem('fzLvl')||'0');applyFz();
  }catch(e){}
}

// ── DARK MODE ─────────────────────────────
function toggleDark(){
  isDark=!isDark;
  document.body.classList.toggle('dark',isDark);
  document.getElementById('dark-lbl').textContent=isDark?'Modo claro':'Modo oscuro';
  saveState();
}

// ── FONT SIZE ─────────────────────────────
let fzLvl=parseInt(localStorage.getItem('fzLvl')||'0');
function applyFz(){
  if(fzLvl>0)document.body.dataset.fz=fzLvl;
  else delete document.body.dataset.fz;
  const ic=document.getElementById('fz-ic');
  if(ic)ic.style.opacity=fzLvl>0?'1':'0.7';
}
function cycleFz(){
  fzLvl=(fzLvl+1)%4;
  localStorage.setItem('fzLvl',fzLvl);
  applyFz();
}

// ── MOBILE SIDEBAR ────────────────────────
function toggleSb(){
  const sb=document.getElementById('sb');
  const ov=document.getElementById('sb-overlay');
  const open=sb.classList.toggle('mob-open');
  ov.classList.toggle('on',open);
}
function closeSb(){
  document.getElementById('sb').classList.remove('mob-open');
  document.getElementById('sb-overlay').classList.remove('on');
}

// ── HELPERS ───────────────────────────────
function pct(){return Math.round((done.size/(TOT-1))*100)}
function updateGreeting(){
  const av=document.getElementById('tb-avatar');
  const gr=document.getElementById('tb-greeting');
  if(uname){av.textContent=uname.charAt(0).toUpperCase();gr.textContent='Hola, '+uname;}
  else{av.textContent='S';gr.textContent='Bienvenido/a';}
}
function buildSb(){
  const nav=document.getElementById('sb-nav');nav.innerHTML='';
  MODS.forEach((m,mi)=>{
    const ms=flat.filter(s=>s.mi===mi);
    const mStart=flat.findIndex(s=>s.mi===mi);
    const isAct=cur>=mStart&&cur<mStart+ms.length;
    const isDone=ms.every((_,si)=>done.has(mStart+si));
    const div=document.createElement('div');
    div.className='sb-mod'+(isAct?' open':'');
    div.innerHTML=`<div class="sb-mod-hdr" onclick="this.parentElement.classList.toggle('open')">
      <div class="sb-mod-num${isDone?' done':isAct?' act':''}">${m.num}</div>
      <div class="sb-mod-info">
        <div class="sb-mod-name">${m.name}</div>
        <div class="sb-mod-meta">${m.dur} · ${[...done].filter(d=>d>=mStart&&d<mStart+ms.length).length}/${ms.length}</div>
      </div>
      <i class="ti ti-chevron-down sb-chev"></i></div>
      <div class="sb-slides">${ms.map((s,si)=>{const gi=mStart+si;const isA=gi===cur;const isD=done.has(gi);
        return`<div class="sb-slide${isA?' act':isD?' done':''}" onclick="goTo(${gi});closeSb()"><div class="sb-dot"></div>${s.lbl}</div>`;
      }).join('')}</div>`;
    nav.appendChild(div);
  });
  const p=pct();
  document.getElementById('sb-pf').style.width=p+'%';
  document.getElementById('sb-pc').textContent=p+'%';
}
function updateTb(){
  const s=flat[cur];const m=MODS[s.mi];
  document.getElementById('tb-lbl').textContent=String(cur+1).padStart(2,'0')+' / '+TOT;
  document.getElementById('tb-sect').textContent=m?'Módulo '+m.num+' · '+m.name:'';
  const p=pct();
  document.getElementById('tb-bf').style.width=p+'%';
  document.getElementById('tb-pct').textContent=p+'%';
  document.getElementById('btn-back').disabled=cur===0;
  document.getElementById('btn-back').style.opacity=cur===0?'0.3':'1';
  document.getElementById('btn-next').style.display=flat[cur].t==='complete'?'none':'';
  updateGreeting();
}

// ── NAVIGATION ────────────────────────────
function goTo(i){cur=i;qAns=false;qIdx=0;brStep=0;pipeSelIdx=null;scStep=0;renderWithFade();}
function nav(d){
  if(d===1&&cur<TOT-1){done.add(cur);cur++;qAns=false;qIdx=0;brStep=0;pipeSelIdx=null;scStep=0;saveState();renderWithFade();}
  else if(d===-1&&cur>0){cur--;qAns=false;qIdx=0;brStep=0;pipeSelIdx=null;scStep=0;saveState();renderWithFade();}
}
function confirmReset(){
  cur=0;done=new Set();uname='';qAns=false;qIdx=0;brStep=0;pipeSelIdx=null;scStep=0;
  pData={L:{g:'',p:'',c:'',pr:''},D:{g:'',p:'',c:'',pr:''},Pa:{g:'',p:'',c:'',pr:''}};
  pitchReflect='';aprof='L';
  saveState();
  document.getElementById('reset-modal').classList.remove('on');
  renderWithFade();

function renderQuiz(el,mi,questions,hint){
  if(qIdx===0)quizScores[mi]={c:0,t:0};
  const q=questions[qIdx];
  const tot=questions.length;
  const nb=document.getElementById('btn-next');
  nb.disabled=true;nb.style.opacity='0.35';
  el.innerHTML=modTag(mi)+`<h1 class="st">Verifica tu comprensión</h1>
    <p class="ss">Antes de avanzar, comprueba qué tan sólido tienes esto.</p>
    <div class="qcard">
      <div class="q-meta">PREGUNTA ${qIdx+1} DE ${tot}</div>
      <div class="q-txt">${q.txt}</div>
      <div class="qopts">${q.opts.map((o,i)=>`<button class="qo" id="qo-${i}" onclick="selQ(${i})"><div class="ql">${String.fromCharCode(65+i)}</div>${o}</button>`).join('')}</div>
      <div id="qfb" style="display:none"></div>
      <div class="q-footer">
        <button class="q-confirm" id="q-confirm" onclick="ansQ()">Confirmar respuesta →</button>
      </div>
    </div>`;
  hint.innerHTML='<span style="font-size:13px;color:var(--txt-lt)"><i class="ti ti-info-circle"></i> Selecciona una respuesta</span>';
  window._qqs=questions;window._qSel=null;window._qmi=mi;window._qel=el;window._qhint=hint;
  window.selQ=(i)=>{
    window._qSel=i;
    document.querySelectorAll('.qo').forEach((b,j)=>{b.classList.remove('qo-sel');if(j===i)b.classList.add('qo-sel');});
    document.getElementById('q-confirm').classList.add('on');
  };
  window.ansQ=()=>{
    if(window._qSel===null||qAns)return;qAns=true;
    const ch=window._qSel;const isOk=ch===q.cor;
    if(!quizScores[mi])quizScores[mi]={c:0,t:0};
    quizScores[mi].t++;if(isOk)quizScores[mi].c++;
    saveState();
    document.querySelectorAll('.qo').forEach(b=>{b.disabled=true;b.classList.remove('qo-sel');});
    document.getElementById('qo-'+ch).classList.add(isOk?'cor':'wr');
    if(!isOk)document.getElementById('qo-'+q.cor).classList.add('cor');
    const fb=document.getElementById('qfb');
    fb.className='qfb '+(isOk?'ok':'nok');fb.textContent=isOk?q.ok:q.nok;fb.style.display='block';
    hint.innerHTML='';
    if(qIdx<window._qqs.length-1){
      document.getElementById('q-confirm').outerHTML=
        '<button class="br-sig" style="margin-top:0" onclick="qNext()">Siguiente pregunta →</button>';
    } else {
      document.getElementById('q-confirm').style.display='none';
      nb.disabled=false;nb.style.opacity='1';
    }
  };
  window.qNext=()=>{qAns=false;qIdx++;renderQuiz(window._qel,window._qmi,window._qqs,window._qhint);};
}

function getQuizPct(){

  const tc=vals.reduce((s,v)=>s+v.c,0);

  return tt>0?tc/tt:0;
}

function calc_time(el){
  el.innerHTML=modTag(0)+`<h1 class="st">¿Cuánto vale el tiempo de tu cliente?</h1>
    <p class="ss">Antes de hablar de automatización, necesitas sentir el problema en números. Escribe una estimación — no hay respuesta correcta.</p>
    <div class="calc-wrap">
      <div class="calc-inputs">
        <div><label>¿Cuántas personas tiene el equipo operativo de tu cliente?</label>
          <div class="calc-input-row"><input type="number" id="ci-p" min="1" max="500" placeholder="15" oninput="calcCost()"><span class="calc-unit">personas</span></div></div>
        <div><label>¿Cuántas horas semanales dedican a tareas repetitivas?</label>
          <div class="calc-input-row"><input type="number" id="ci-h" min="1" max="40" placeholder="8" oninput="calcCost()"><span class="calc-unit">horas / persona / sem</span></div></div>
      </div>
      <div class="calc-result" id="cr"><div class="calc-placeholder">Ingresa los datos para ver el cálculo</div></div>
    </div>
    <div class="calc-insight" id="ci-ins" style="display:none">
      <i class="ti ti-bulb"></i>
      <p>Ese número es el costo invisible que el cliente no ha calculado. <strong>Tú sí lo calculaste.</strong> Esa diferencia es tu ventaja en la primera conversación.</p>
    </div>`;
  window.calcCost=()=>{
    const p=parseInt(document.getElementById('ci-p').value)||0;
    const h=parseInt(document.getElementById('ci-h').value)||0;
    const cr=document.getElementById('cr'),ins=document.getElementById('ci-ins');
    if(p>0&&h>0){
      const wk=p*h,yr=wk*52,cost=yr*25;
      cr.innerHTML=`<div class="calc-num-grid">
        <div class="calc-stat"><div class="calc-num">${wk.toLocaleString()}</div><div class="calc-lbl">horas/semana</div></div>
        <div class="calc-div"></div>
        <div class="calc-stat"><div class="calc-num">${yr.toLocaleString()}</div><div class="calc-lbl">horas/año</div></div>
        <div class="calc-div"></div>
        <div class="calc-stat"><div class="calc-num">~$${(cost/1000).toFixed(0)}K</div><div class="calc-lbl">costo est./año</div></div>
      </div>`;
      ins.style.display='flex';
    }else{cr.innerHTML='<div class="calc-placeholder">Ingresa los datos para ver el cálculo</div>';ins.style.display='none';}
  };
}

function value_prop(el){
  const rows=[
    {feat:'Tiempo de impl.',gen:'3–6 meses con desarrollo custom',nos:'2–6 semanas (procesos existentes)'},
    {feat:'Punto de partida',gen:'Construye desde cero',nos:'Conecta lo que ya tienes'},

    {feat:'Mantenimiento',gen:'Requiere equipo técnico interno',nos:'Incluido en la relación de la agencia'},
    {feat:'Foco',gen:'La tecnología en sí misma',nos:'El proceso de negocio del cliente'}
  ];
  let revealed=new Set();
  el.innerHTML=modTag(0)+`<h1 class="st">¿Por qué nosotros?</h1>
    <p class="ss">Cuando un cliente busca automatización, tiene opciones. Lo que nos diferencia no es la tecnología — es cómo trabajamos. Haz clic en cada fila para revelar la comparación.</p>
    <div class="vp-table">
      <div class="vp-hdr"><div></div><div>Agencia genérica / Freelancer</div><div class="vp-hdr-us">Nosotros</div></div>
      ${rows.map((r,i)=>`<div class="vp-row" id="vpr-${i}" onclick="revVp(${i})">
        <div class="vp-feat">${r.feat}</div>
        <div class="vp-gen" id="vpg-${i}"><span class="vp-ph">Clic para revelar</span></div>
        <div class="vp-us" id="vpu-${i}"><span class="vp-ph">Clic para revelar</span></div>
      </div>`).join('')}
    </div>
    <div id="vp-msg" style="font-size:13px;color:var(--txt-xlt);font-style:italic">Haz clic fila por fila para construir el argumento.</div>`;
  window._vpRows=rows;window._vpRev=new Set();
  window.revVp=(i)=>{
    if(window._vpRev.has(i))return;window._vpRev.add(i);
    const r=window._vpRows[i];
    document.getElementById('vpg-'+i).textContent=r.gen;
    document.getElementById('vpu-'+i).innerHTML='<strong>'+r.nos+'</strong>';
    document.getElementById('vpr-'+i).classList.add('revealed');
    if(window._vpRev.size===window._vpRows.length){document.getElementById('vp-msg').textContent='✓ Comparación completa. Estos son tus argumentos de venta.';document.getElementById('vp-msg').style.color='var(--olive)';}

function profile_quiz(el){
  const cases=[
    {txt:'"Llevamos tres años creciendo, pero ahora el equipo no da abasto. Me pasan reportes en Excel que nadie lee y los pedidos se están cayendo."',opts:['Laura — Gerente de Operaciones','Diego — Dueño de PYME','Paola — Directora Comercial'],cor:0,ok:'Correcto. El foco en operaciones, procesos caídos y volumen es el mundo de Laura.',nok:'Lee de nuevo: empresa mediana, problema operativo, equipo con sobrecarga. Ese es el perfil de Laura.'},
    {txt:'"Yo soy el que vende, opera y apaga incendios. Si me voy de vacaciones una semana, el negocio se para. Necesito que las cosas funcionen sin que yo esté en todo."',opts:['Laura — Gerente de Operaciones','Diego — Dueño de PYME','Paola — Directora Comercial'],cor:1,ok:'Correcto. "Si me voy el negocio se para" es el dolor clásico de Diego.',nok:'La clave es "sin que yo esté en todo" — esa es la motivación de Diego, el dueño de PYME.'},
    {txt:'"Mi equipo de ventas tiene 12 personas. El problema es que pasan más tiempo actualizando el CRM y enviando propuestas que hablando con clientes."',opts:['Laura — Gerente de Operaciones','Diego — Dueño de PYME','Paola — Directora Comercial'],cor:2,ok:'Correcto. Equipo comercial perdiendo tiempo en tareas manuales = el dolor exacto de Paola.',nok:'El contexto es un equipo de ventas y tiempo perdido en tareas no comerciales. Ese es el perfil de Paola.'}
  ];
  el.innerHTML=modTag(1)+`<h1 class="st">¿A quién tienes adelante?</h1>
    <p class="ss">Lee cada caso y decide con qué perfil estás hablando.</p>
    ${cases.map((c,i)=>`<div class="pq-case">
      <div class="pq-num">Caso ${i+1} de ${cases.length}</div>
      <div class="pq-txt">${c.txt}</div>
      <div class="pq-opts">${c.opts.map((o,j)=>`<button class="pq-btn" id="pqb-${i}-${j}" onclick="ansPQ(${i},${j})">${o}</button>`).join('')}</div>
      <div class="pq-fb" id="pqfb-${i}" style="display:none"></div>
    </div>`).join('')}`;
  window._pqCases=cases;
  window.ansPQ=(ci,j)=>{
    const c=window._pqCases[ci];
    document.querySelectorAll(`#pqb-${ci}-0,#pqb-${ci}-1,#pqb-${ci}-2`).forEach(b=>b.disabled=true);
    const isOk=j===c.cor;
    document.getElementById(`pqb-${ci}-${j}`).classList.add(isOk?'pq-cor':'pq-wr');
    if(!isOk)document.getElementById(`pqb-${ci}-${c.cor}`).classList.add('pq-cor');
    const fb=document.getElementById(`pqfb-${ci}`);
    fb.style.display='block';fb.className='pq-fb '+(isOk?'pq-fb-ok':'pq-fb-nok');
    fb.textContent=isOk?c.ok:c.nok;
  };
}

function objections_practice(el){
  const obs=[
    '"No tenemos tiempo para implementar nada nuevo ahora."',
    '"Ya intentamos algo parecido antes y no funcionó."',
    '"Necesito consultarlo con el área de TI primero."',
    '"¿Pueden garantizarnos que va a funcionar?"',
    '"Prefiero esperar al próximo trimestre para verlo en el presupuesto."'
  ];
  el.innerHTML=modTag(2)+`<h1 class="st">Practica las respuestas</h1>
    <p class="ss">Cinco objeciones nuevas. Para cada una, escribe tu respuesta usando Feel-Felt-Found. Usa el checklist para verificarte antes de avanzar.</p>
    <div class="ob-practice">${obs.map((ob,i)=>`
      <div class="ob-item">
        <div class="ob-num">${i+1}</div>
        <div class="ob-content">
          <div class="ob-quote">${ob}</div>
          <textarea class="ob-ta" id="ob-ta-${i}" placeholder="Feel: valida... Felt: otros también... Found: lo que descubrieron..." oninput="checkOb(${i})"></textarea>
          <div class="ob-checks">
            <div class="ob-ck" id="obc-f1-${i}"><i class="ti ti-square"></i> Feel: ¿validaste la emoción?</div>
            <div class="ob-ck" id="obc-f2-${i}"><i class="ti ti-square"></i> Felt: ¿normalizaste?</div>
            <div class="ob-ck" id="obc-f3-${i}"><i class="ti ti-square"></i> Found: ¿redirigiste con evidencia?</div>
          </div>
        </div>
      </div>`).join('')}
    </div>`;
  window.checkOb=(i)=>{
    const txt=document.getElementById('ob-ta-'+i).value.toLowerCase();
    function setC(id,ok){const e=document.getElementById(id);if(!e)return;const lbl=e.textContent.replace(/^. /,'');e.innerHTML=(ok?'<i class="ti ti-square-check" style="color:var(--olive)"></i> ':'<i class="ti ti-square"></i> ')+lbl;e.style.color=ok?'var(--olive)':'var(--txt-lt)';}
    setC('obc-f1-'+i,txt.length>25);
    setC('obc-f2-'+i,txt.includes('también')||txt.includes('otros')||txt.includes('clientes')||txt.includes('casos'));
    setC('obc-f3-'+i,txt.includes('encontr')||txt.includes('result')||txt.includes('semana')||txt.includes('mes')||txt.includes('descubr')||txt.includes('ROI'));
  };
}
